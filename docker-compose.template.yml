services:
    callme:
        image: mirotalk/cme:latest
        container_name: callme
        hostname: callme
        # Run as non-root (uid:gid). The image already defaults to the non-root
        # "node" user (1000:1000); set this to override with a different uid/gid.
        user: '1000:1000'
        restart: unless-stopped
        ports:
            - '${PORT}:${PORT}'
        volumes:
            - .env:/src/.env:ro
            - ./app/:/src/app/:ro
            - ./public/:/src/public/:ro
